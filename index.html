<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyFrutigerDesk</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1 id="logo">AeroDesk</h1>
    </header>

    <div class="content">
        <nav>
            <h2>Home</h2>

            <button id="startBut">Start</button>
            <button id="tasksBut">Tasks</button>
            <button id="notesBut">Notes</button>
            <button id="settingsBut">Settings</button>
        </nav>

        <main>
            <div id="mainWindow" class="HLwindow"> <!--HL = highlight btw-->
                <h2>Welcome to AeroDesk!</h2>
                <p>Choose an option on the Home menu.</p>
            </div>

            <div id="settingsWindow" class="HLwindow">
                <h2>Settings</h2>
                <button id="soundButton">Enable UI sounds</button>
            </div>

            <div id="tasksWindow" class="HLwindow">
                <h2>Tasks</h2>
            </div>

            <div id="notesWindow" class="HLwindow">
                <h2>Notes</h2>
            </div>
        </main>
        

    </div>
    <footer>

    </footer>

    <script src="js/script.js"></script>
</body>
</html>
